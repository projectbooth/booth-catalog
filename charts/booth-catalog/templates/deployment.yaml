apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booth-catalog.fullname" . }}
  labels:
    {{- include "booth-catalog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "booth-catalog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booth-catalog.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "booth-catalog.serviceAccountName" . }}
      # No token: this module never talks to the Kubernetes API (it holds no Secrets and needs
      # no RBAC), so a mounted service-account token would only be attack surface. The event-bus
      # credential below is an ordinary mounted Secret written for us by booth-core, not something
      # we fetch.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: booth-catalog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BOOTH_HTTP_ADDR
              value: ":8080"
            - name: BOOTH_OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            - name: BOOTH_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: BOOTH_OIDC_REQUIRE_AUDIENCE
              value: {{ .Values.oidc.requireAudience | quote }}
            - name: BOOTH_OIDC_GROUPS_CLAIM
              value: {{ .Values.oidc.groupsClaim | quote }}
            - name: BOOTH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.dsnSecret.name is required: booth-catalog keeps its data in PostgreSQL (ADR 0014)" .Values.postgres.dsnSecret.name }}
                  key: {{ .Values.postgres.dsnSecret.key }}
            {{- if .Values.eventBus.enabled }}
            {{- if .Values.eventBus.credentialsSecret.enabled }}
            # The credential booth-core minted for this module's declared `events` (ADR 0050). The
            # file is re-read on every reconnect, so core's in-place renewal is picked up.
            - name: BOOTH_NATS_CREDS_FILE
              value: /etc/booth/event-bus/nats.creds
            {{- if .Values.nats.url }}
            - name: BOOTH_NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- else }}
            - name: BOOTH_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.eventBus.credentialsSecret.name }}
                  key: url
            {{- end }}
            {{- else }}
            - name: BOOTH_NATS_URL
              value: {{ required "nats.url is required when eventBus.credentialsSecret.enabled is false: with no credentials Secret to take the address from, the event bus has nowhere to connect (set eventBus.enabled=false to leave the event bus out on purpose)" .Values.nats.url | quote }}
            {{- end }}
            {{- end }}
            - name: BOOTH_CATALOG_MAX_CODE_BYTES
              value: {{ .Values.maxCodeSourceBytes | int64 | quote }}
          # /livez does not look at the database on purpose: restarting the pod cannot fix a
          # Postgres outage. /healthz (readiness, and what core polls) does.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if and .Values.eventBus.enabled .Values.eventBus.credentialsSecret.enabled }}
          volumeMounts:
            # A directory mount, deliberately not a single-file mount: the kubelet updates a mounted Secret in
            # place when core renews the credential, but never a single-file (sub-path) mount of one.
            - name: event-bus-credentials
              mountPath: /etc/booth/event-bus
              readOnly: true
          {{- end }}
      {{- if and .Values.eventBus.enabled .Values.eventBus.credentialsSecret.enabled }}
      volumes:
        - name: event-bus-credentials
          secret:
            secretName: {{ .Values.eventBus.credentialsSecret.name }}
            # Not `optional`: if booth-core hasn't written the credential the pod waits, loudly
            # (ContainerCreating with a mount error), instead of starting without one.
            items:
              - key: nats.creds
                path: nats.creds
      {{- end }}
