# Default values for booth-catalog.

replicaCount: 1

image:
  repository: ghcr.io/projectbooth/booth-catalog
  tag: "" # defaults to Chart.appVersion; overridden by CI to the published tag (contracts/testing-strategy.md)
  pullPolicy: IfNotPresent

service:
  port: 8080

oidc:
  # Required: same OIDC issuer/client every module verifies against independently
  # (core-platform-api.md's defense-in-depth requirement). Left empty by default.
  issuerUrl: ""
  clientId: ""
  requireAudience: true
  # The token claim carrying workspace memberships (ADR 0025). booth-catalog re-derives the
  # caller's role from it rather than trusting the gateway-forwarded X-Booth-Role (ADR 0041),
  # so it MUST match booth-core's BOOTH_OIDC_GROUPS_CLAIM.
  groupsClaim: groups

# The catalog's data lives in this module's own database on the shared PostgreSQL cluster
# (ADR 0014). Reference an existing Secret holding the connection string; this chart does not
# create the database or role.
postgres:
  dsnSecret:
    name: ""
    key: dsn

# The event bus (NATS, ADR 0021) the dashboard.created/updated/deleted subscription uses.
#
# booth-core's bus authenticates every connection (ADR 0049/0050): the module's manifest declares
# `events: {subscribe: [dashboard.*]}` (rendered into the BoothModule below), and booth-core answers
# by writing a Secret into this namespace holding a credential scoped to exactly that plus the
# bus's in-cluster URL. The pod mounts it and connects with it; there is nothing to configure.
#
# The pod will not start until booth-core has written the Secret (it does so when it sees the
# BoothModule this chart creates) — deliberately: a catalog that came up without credentials would
# look healthy while indexing no dashboards at all, which is exactly the silent failure this avoids.
eventBus:
  # false leaves the event bus out entirely: no `events` on the manifest, no credential, no
  # subscription. Datasets and code work fully; no dashboards are ever indexed. It is an explicit
  # choice, never the result of forgetting to set something.
  enabled: true
  credentialsSecret:
    # Read the credential from booth-core's Secret (the normal case). Set false only against a bus
    # with authentication off (a test stand-in, local development), and then nats.url is required.
    enabled: true
    # The name booth-core gives it (ADR 0050); overridable only to match a core that names it otherwise.
    name: booth-event-bus-credentials

nats:
  # Overrides the URL in the credentials Secret. Leave empty in a real install: core writes the right
  # in-cluster address there. Required when eventBus.credentialsSecret.enabled is false.
  url: ""

# Cap on one code version's source, in bytes.
maxCodeSourceBytes: 1048576

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources: {}

serviceAccount:
  create: true
  name: ""
