apiVersion: v2
name: booth-catalog
description: >
  Project Booth's catalog module: register and browse datasets, reusable code with version
  history, and dashboards indexed from the dashboard modules' events, with lineage and
  cross-asset search.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/projectbooth/booth-catalog

# ADR 0113 / contracts/module-manifest.md "Chart annotation: identity keys": tells
# booth-core's install API which of this chart's values.yaml paths carry the platform's
# shared identity settings, so a module installed through the install API (the Module
# Store's Install button included) is configured without hand-typed values. Core fills a
# mapped path only when the request doesn't already set it. This chart has no
# identity.issuerUrl-style iframe setting, so iframeIssuerUrl is omitted.
annotations:
  booth.projectbooth.io/identity-keys: |
    {"issuerUrl":"oidc.issuerUrl","clientId":"oidc.clientId","jwksUrl":"oidc.jwksUrl","workloadIssuerUrl":"workloadIdentity.issuerUrl","groupsClaim":"oidc.groupsClaim"}
